<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岩芯薄片批次归档台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="mast">
      <div>
        <p>Petrographic Batch Archive</p>
        <h1>岩芯薄片批次归档台</h1>
      </div>
      <button id="exportBtn" type="button">导出全部批次</button>
    </header>

    <section class="layout">
      <div class="left-stack">
        <section class="panel batches">
          <h2>批次</h2>
          <div id="batchList" class="batch-list"></div>
          <p id="batchHint" class="batch-hint"></p>
          <div class="batch-actions">
            <button id="newBatchBtn" type="button">新建批次</button>
            <button id="archiveBatchBtn" type="button" class="ghost">归档当前批次</button>
            <button id="reviseBatchBtn" type="button" class="ghost" hidden>据此创建修订批次</button>
          </div>
        </section>

        <form id="sampleForm" class="panel editor">
          <h2>样本录入</h2>
          <p class="form-note">新样本归属当前草稿批次；编号唯一性与完整性在归档时统一核对。</p>
          <label>显微照片<input id="photoInput" type="file" accept="image/*"></label>
          <label>样本编号<input name="code" required placeholder="BX-17-03"></label>
          <label>采样地点<input name="location" placeholder="剖面东侧第二层"></label>
          <div class="pair">
            <label>放大倍数<input name="magnification" placeholder="40x"></label>
            <label>偏光类型
              <select name="polarization">
                <option>单偏光</option>
                <option>正交偏光</option>
                <option>反射光</option>
              </select>
            </label>
          </div>
          <label>主要矿物<input name="minerals" placeholder="石英、斜长石、黑云母"></label>
          <label>颗粒结构<input name="texture" placeholder="半自形粒状、碎裂结构"></label>
          <label>老师批注<textarea name="comment" rows="4" placeholder="记录鉴定依据或疑点"></textarea></label>
          <button type="submit">保存样本</button>
        </form>

        <section id="historyGate" class="panel gate" hidden>
          <h2>历史只读</h2>
          <p id="gateText"></p>
          <button id="gateReviseBtn" type="button">创建修订批次</button>
          <button id="gateBackBtn" type="button" class="ghost">返回开放批次</button>
          <button id="gateNewBtn" type="button" class="ghost">新建空白批次</button>
        </section>
      </div>

      <section class="panel board">
        <div class="board-head">
          <div>
            <h2 id="boardTitle"></h2>
            <p id="boardSub" class="board-sub"></p>
          </div>
        </div>
        <div id="historyBanner" class="history-banner" hidden>
          <span>已归档批次：样本与对比选择已锁定，仍可按历史查看与筛选；任何改动须经修订批次进行，旧批次不改动。</span>
          <button id="bannerReviseBtn" type="button">创建修订批次</button>
          <button id="bannerBackBtn" type="button" class="ghost">返回开放批次</button>
        </div>
        <div id="archiveIssues" class="issues" hidden></div>
        <div class="filters">
          <input id="mineralFilter" placeholder="按矿物筛选当前批次">
          <select id="polarFilter">
            <option value="">全部偏光</option>
            <option>单偏光</option>
            <option>正交偏光</option>
            <option>反射光</option>
          </select>
        </div>
        <div id="sampleGrid" class="sample-grid"></div>
      </section>

      <aside class="panel compare">
        <h2>并排对比</h2>
        <p id="compareNote" class="compare-note"></p>
        <div id="comparePane" class="compare-pane"></div>
      </aside>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
